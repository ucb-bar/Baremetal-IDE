# OpenOCD Platform Configuration for the penguin26 tapeout chip
#
# *** UNTESTED: written from the EE290SimConfig RTL/DTS only; never run against hardware. ***
#
# - 1 hart (Shuttle), debug module at 0x0 ([DTS] debug-controller@0, "riscv,debug-013").
# - Expected IDCODE 0x00000001: chipyard drives the JTAG IDCODE from JtagDTMKey
#   (iobinders/IOBinders.scala:340-342), whose default (rocket-chip
#   devices/debug/DebugTransport.scala JtagDTMKeyDefault) is version 0 / part 0 / manuf 0;
#   IDCODE bit 0 is always 1. Update if the tapeout config overrides JtagDTMKey.
# - No work area: the only SRAM is the 64 KiB scratchpad at 0x08000000, which the DTS marks
#   status = "disabled". Enable `-work-area-phys 0x08000000` once it's confirmed usable.

# Use FT-LINK (same adapter as the other course platforms)
source [find ./platform/shared/ft-link.cfg]

### Set the target chip name and expected TAP ID ###
set _CHIPNAME riscv
set _CPUTAPID 0x00000001

### Add TAPs to the Scan Chain ###
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id $_CPUTAPID

### Add CPU targets ###
set _TARGETNAME_0 $_CHIPNAME.cpu0
target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid 0

# $_TARGETNAME_0 configure -work-area-phys 0x08000000 -work-area-size 0x1000 -work-area-backup 0

### Chip reset procedure ###
targets 0

init
halt

echo "Ready for Remote Connections"
