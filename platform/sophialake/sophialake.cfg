# use FT-LINK, plugged into J7 of the SophiaLake board
source [find ./platform/shared/ft-link.cfg]
# the board's own FTDI ("SophiaLake Bringup Platform") has the same VID:PID;
# the FT-LINK has no EEPROM, so it keeps the FT2232H's default description
ftdi device_desc            "Dual RS232-HS"

### Set the target chip name and expected TAP ID ###
set _CHIPNAME riscv
# rocket-chip's default IDCODE; RocketSophiaLakeConfig doesn't set JtagDTMKey
set _CPUTAPID 0x00000001


### Add TAPs to the Scan Chain ###
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id $_CPUTAPID


### Add CPU targets ###
set _TARGETNAME_0 $_CHIPNAME.cpu0

target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid 0

### Configure work area ###
# Work areas are small RAM areas associated with CPU targets. They are used by OpenOCD to speed up
# downloads. Use the top 4 KiB of the 64 KiB scratchpad, which the linker script leaves empty.
set _WORKAREASIZE 0x1000
$_TARGETNAME_0 configure -work-area-phys 0x0800F000 -work-area-size $_WORKAREASIZE -work-area-backup 0

### Chip reset procedure ###
# No halt here: GDB halts the core when it attaches, and a running program
# (e.g. one loaded over UART-TSI) keeps running while only OpenOCD is up.
init

echo "Ready for Remote Connections"
